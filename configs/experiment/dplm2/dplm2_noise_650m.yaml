# @package _global_

# DPLM2 + noise-input diffusion finetuning (hybrid ablation).
#
# Same multi-task discrete masking schedule as DPLM2, but masked positions
# receive a fresh Gaussian noise vector instead of a shared <mask> embedding.
# No noise schedule, no sigma, no ODE step — purely an input-augmentation
# control to disentangle hybrid's noisy-input effect from its score machinery.
#
# Usage:
#   python train.py experiment=dplm2/dplm2_noise_650m

defaults:
  - /datamodule: tokenized_protein
  - /callbacks: lm
  - /trainer: ddp_bf16

project: "DPLM2_Noise_650m_FT_0428"
name: "dplm2_noise_650m"

datamodule:
  data_dir: ${paths.data_dir}
  csv_file: pdb_swissprot
  vocab_file: airkingbd/dplm2_650m
  struct_vocab_size: 8192
  max_tokens: 8000
  max_len: 512

model:
  _target_: dplm2_noise
  num_diffusion_timesteps: 500
  gradient_ckpt: false
  training_stage: finetune_from_dplm2_hf
  # --- Multi-task ratios ---
  single_modality_ratio: 0.0
  folding_loss_ratio: 0.0
  inverse_folding_loss_ratio: 1.0
  joint_loss_ratio: 0.0
  independent_loss_ratio: 0.0
  # --- ESM embedding config ---
  token_dropout: false
  cutoff_layer0_attn_residual: true
  # --- Inference: noise sampling behavior (overridable via CLI) ---
  sample_noise_every_step: false
  # --- LoRA config ---
  lora:
    enable: true
    lora_rank: 16
    lora_dropout: 0.1
    lora_target_module: (esm.encoder.layer.[0-9]*.attention.(self.query|self.key|self.value|output.dense).*|esm.encoder.layer.[0-9]*.(intermediate|output).dense.*)
    modules_to_save: lm_head,esm.embeddings
    train_layer_norm: true
  # --- Network backbone ---
  net:
    arch_type: esm
    name: airkingbd/dplm_650m
    dropout: 0.1
    pretrain: false
    pretrained_model_name_or_path: airkingbd/dplm2_650m
  self_mixup:
    enable: false
    with_original_loss: false
  tokenizer:
    vocab_file: ${datamodule.vocab_file}
    vocab_size: 33
  struct_tokenizer:
    exp_path: airkingbd/struct_tokenizer

task:
  _target_: lm/dplm2
  learning:
    watch_t1_t2_loss: false
    cal_constant_loss: true
    weight: constant
    validation_max_iter: 50
    use_ema: false
    ema_decay: 0.999
    fullseq_loss_weight: 0.0
  criterion:
    _target_: byprot.modules.cross_entropy.StructAARDMCrossEntropyLoss
    label_smoothing: 0.0
    ignore_index: 1
  optimizer:
    type: adamw
    _partial_: true
    lr: ${train.lr}
    betas:
      - 0.9
      - 0.95
    weight_decay: 0.01
  lr_scheduler:
    type: polynomial
    warmup_steps: 2000
    total_steps: ${trainer.max_steps}
    lr: ${train.lr}
    lr_end: 1e-5
    warmup_init_lr: 1e-07
    power: 1

train:
  seed: 42
  lr: 1e-4
  monitor: "val/loss"
  mode: "min"
  patience: 1000

trainer:
  min_epochs: 30
  max_epochs: 50
  gradient_clip_val: 0.5
  num_sanity_val_steps: -1
  reload_dataloaders_every_n_epochs: 1
  use_distributed_sampler: false
  max_steps: 100_000
  accumulate_grad_batches: 8
  check_val_every_n_epoch: null
  val_check_interval: 3280
  enable_progress_bar: true
  num_nodes: 1
